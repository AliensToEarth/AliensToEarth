<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="'Minecraft', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="640" height="240" fill="#000000"/>
  <rect x="4" y="4" width="632" height="232" fill="#1a1a1a"/>
  <rect x="4" y="4" width="632" height="232" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="8" y="8" width="624" height="224" fill="none" stroke="#0c0c0c" stroke-width="2"/>

  <defs>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="240"><animate attributeName="width" from="0" to="624" begin="0.3s" dur="1.2s" fill="freeze" repeatCount="1"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="240"><animate attributeName="width" from="0" to="624" begin="1.6s" dur="1.3s" fill="freeze" repeatCount="1"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="240"><animate attributeName="width" from="0" to="624" begin="3.1s" dur="1.3s" fill="freeze" repeatCount="1"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="240"><animate attributeName="width" from="0" to="624" begin="4.6s" dur="1.0s" fill="freeze" repeatCount="1"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="240"><animate attributeName="width" from="0" to="624" begin="5.8s" dur="1.0s" fill="freeze" repeatCount="1"/></rect></clipPath>
  </defs>

  <g clip-path="url(#l1)">
    <text x="20" y="48" font-size="10.5" xml:space="preserve"><tspan fill="#808080">[23:59:59]</tspan><tspan fill="#4ec9b0"> [Fabric Server/INFO]:</tspan><tspan fill="#dcdcdc"> Profile is loading </tspan></text>
  </g>

  <g clip-path="url(#l2)">
    <text x="20" y="88" font-size="10.5" xml:space="preserve"><tspan fill="#808080">[00:00:01]</tspan><tspan fill="#4ec9b0"> [Server thread/INFO]:</tspan><tspan fill="#dcdcdc"> Codebase is still processing, some repos are invisible</tspan></text>
  </g>

  <g clip-path="url(#l3)">
    <text x="20" y="128" font-size="10.5" xml:space="preserve"><tspan fill="#808080">[00:00:02]</tspan><tspan fill="#4ec9b0"> [Server thread/INFO]:</tspan><tspan fill="#dcdcdc"> Earthling visitor detected</tspan></text>
  </g>

  <g clip-path="url(#l4)">
    <text x="20" y="168" font-size="10.5" xml:space="preserve"><tspan fill="#808080">[00:00:03]</tspan><tspan fill="#4ec9b0"> [Server thread/INFO]:</tspan><tspan fill="#dcdcdc"> Next commit will be </tspan><tspan fill="#ffffff">████████</tspan></text>
  </g>

  <g clip-path="url(#l5)">
    <text x="20" y="208" font-size="10.5" xml:space="preserve"><tspan fill="#808080">[00:00:04]</tspan><tspan fill="#4ec9b0"> [Fabric Server/INFO]:</tspan><tspan fill="#dcdcdc"> Profile is ready</tspan></text>
